services:
  engine:
    build: ./engine
    ports:
      - "5001:5001"

  server:
    build: ./server
    ports:
      - "8000:8000"
    depends_on:
      - engine
    environment:
      - FUZZY_ENGINE_URL=http://engine:5001

  client:
    build: ./client
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      - FUZZY_ENGINE_URL=http://engine:5001
